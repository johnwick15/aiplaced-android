name: Build CSCAPrep Native APK

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

on:
  workflow_dispatch:
  push:
    branches: [ cscaprep-android ]
    paths-ignore:
      - 'CSCAPrep-Native.apk.b64'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Sign APK with stable development key
        run: |
          curl -fsSL https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.pk8 -o testkey.pk8
          curl -fsSL https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.x509.pem -o testkey.x509.pem
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --key testkey.pk8 \
            --cert testkey.x509.pem \
            --out CSCAPrep-Native.apk \
            app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs CSCAPrep-Native.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CSCAPrep-Native-Android
          path: CSCAPrep-Native.apk
          if-no-files-found: error

      - name: Publish retrievable APK bytes
        run: |
          base64 -w0 CSCAPrep-Native.apk > CSCAPrep-Native.apk.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CSCAPrep-Native.apk.b64
          git commit -m "Publish CSCAPrep native APK v1.1.0 [skip ci]"
          git push origin HEAD:cscaprep-android
