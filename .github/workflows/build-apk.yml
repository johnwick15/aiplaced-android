name: Build AI Placed APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Android project
        run: |
          cat project.part00 project.part01 project.part02 project.part03 project.part04 project.part05 project.part06 > project.b64
          base64 -d project.b64 > project.zip
          unzip -q project.zip
          cd aiplaced-android-v0.1
          patch -p1 < ../v0.2.patch
          patch -p1 < ../v0.2.1-delta.patch

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: aiplaced-android-v0.1
        run: gradle --no-daemon :app:assembleDebug

      - name: Sign prototype APK with stable development key
        run: |
          curl -fsSL https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.pk8 -o testkey.pk8
          curl -fsSL https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.x509.pem -o testkey.x509.pem
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --key testkey.pk8 \
            --cert testkey.x509.pem \
            --out AIPlaced.apk \
            aiplaced-android-v0.1/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs AIPlaced.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIPlaced-APK-v0.2.1-stable
          path: AIPlaced.apk
          if-no-files-found: error
